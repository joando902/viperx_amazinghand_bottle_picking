/**:
  ros__parameters:
    # Detector settings. The printed card and this family must match.
    tag_family: "tag36h11"
    tag_threads: 2
    tag_decimate: 1.0
    tag_blur: 0.0
    tag_refine_edges: 1
    tag_debug: 0
    max_hamming_dist: 2
    remove_duplicates: true

    # Required for the tag coordinate frame to appear on /tf and in RViz2.
    publish_tf: true
    publish_tag_detections_image: true
    transport_hint: "raw"

    # The size is the side length of the black/white boundary, in metres.
    # It is NOT necessarily the outer edge of the printed paper.
    standalone_tags:
      tag_names: ["tag_0"]
      tag_0:
        id: 0
        size: 0.040

